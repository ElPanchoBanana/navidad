<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <title>Navidad — Mapa de regalos</title>
  <meta name="description" content="Mapa navideño: encuentra a cada persona y abre su página de regalos." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@5.0.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="hub.css" />
<style>
    /* Forzar layout escritorio ~1080px (sensación web años 2000 en móvil) */
    html { min-width: 1080px; }
</style>
</head>
<body>
  <div id="map" role="application" aria-label="Mapa de Navidad"></div>
  <div class="snow" id="snow" aria-hidden="true"></div>
  <div class="sleigh" aria-hidden="true"><span style="display:inline-block;transform:scaleX(-1)">🦌🦌🦌🛷🎅</span></div>

  <div id="music-gate" class="music-gate" role="dialog" aria-modal="true" aria-label="Música obligatoria">
    <p class="music-gate__brand">Navidad</p>
    <button type="button" id="music-start" class="music-start">
      ► ESCUCHAR BURRITO SABANERO ◄
    </button>
    <p>Obligatorio: activa la canción para entrar al mapa</p>
  </div>

  <header class="hud">
    <p class="brand">Navidad</p>
    <p class="lede">Un mapa para encontrar a cada persona y abrir su página de regalos.</p>
    <p class="hint">6 pins · toca una foto</p>
  </header>

  <script src="https://unpkg.com/maplibre-gl@5.0.1/dist/maplibre-gl.js"></script>
  <script src="hub.js"></script>
</body>
</html>
